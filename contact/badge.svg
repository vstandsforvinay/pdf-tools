<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0284c7; letter-spacing: 0.8px; text-transform: uppercase; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #334155; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
    .placeholder-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #94a3b8; }
  </style>

  <!-- Card Background -->
  <rect x="15" y="15" width="370" height="450" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#card-shadow)" />

  <!-- Shielded Relay Badge -->
  <rect x="135" y="32" width="130" height="24" rx="12" fill="#e0f2fe" />
  <text x="200" y="48" text-anchor="middle" class="subtitle">Shielded Relay</text>

  <!-- Header -->
  <text x="200" y="80" text-anchor="middle" class="title">SCAN TO CONTACT</text>
  <text x="200" y="98" text-anchor="middle" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b;">Identity &amp; Phone Numbers Masked</text>

  <!-- QR Border Box -->
  <rect x="100" y="115" width="200" height="200" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- QR Insertion Area: Replace this <g> with your QR image -->
  <image href="qrcode.png" x="110" y="125" width="180" height="180" />

  <!-- Feature List -->
  <g transform="translate(45, 332)">
    <circle cx="12" cy="12" r="10" fill="#dcfce7" />
    <path d="M 8.5 10 C 8.5 13 11 15.5 14 15.5 L 15 14 L 13.5 12.5 L 12.5 13 C 11.5 12.5 11 11.5 10.5 10.5 L 11 9.5 L 9.5 8 Z" fill="#15803d" />
    <text x="32" y="16" class="item-text">Private Voice Call (Zero App Needed)</text>

    <circle cx="12" cy="38" r="10" fill="#e0e7ff" />
    <path d="M 12 31 L 8.5 41 L 12 39.5 L 15.5 41 Z" fill="#4338ca" />
    <text x="32" y="42" class="item-text">Instant Parking &amp; Emergency Alerts</text>

    <circle cx="12" cy="64" r="10" fill="#fef3c7" />
    <path d="M 12 58 L 15.5 64 L 8.5 64 Z" fill="#b45309" />
    <text x="32" y="68" class="item-text">Opens Directly in Phone Camera / Browser</text>
  </g>

  <!-- Bottom Divider & Footer -->
  <line x1="35" y1="426" x2="365" y2="426" stroke="#f1f5f9" stroke-width="1.5" />
  <text x="200" y="445" text-anchor="middle" class="footer-text">Works with iOS &amp; Android Default Camera</text>
</svg>
