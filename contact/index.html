<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vehicle Relay</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; }
    body { background-color: #0b0f19; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; color: #ffffff; overflow-x: hidden; }
    
    /* Standard Vehicle Contact Card (Caller View) */
    .card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; color: #1e293b; position: relative; }
    .badge { display: inline-block; padding: 4px 12px; background: #e0f2fe; color: #0284c7; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    p.subtext { color: #64748b; font-size: 13px; margin-bottom: 20px; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-bottom: 10px; transition: 0.2s; }
    .btn-call { background: #16a34a; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); }
    .btn-preset { background: #f8fafc; color: #334155; border: 1px solid #e2e8f0; text-align: left; padding: 12px 16px; font-size: 14px; }
    .custom-box { margin-top: 14px; text-align: left; }
    textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; resize: none; font-size: 13.5px; outline: none; }
    .btn-send { background: #0284c7; color: white; margin-top: 6px; }
    .status { margin-top: 14px; font-size: 13px; font-weight: 600; display: none; }

    /* --- iOS Call Interface (Full Screen Receiver UI) --- */
    #iosCallView { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, #1e293b 0%, #000000 100%); z-index: 9999; flex-direction: column; justify-content: space-between; align-items: center; padding: 60px 24px 70px; text-align: center; }
    .ios-header { display: flex; flex-direction: column; align-items: center; }
    .ios-avatar { width: 90px; height: 90px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .ios-title { font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
    .ios-subtitle { font-size: 15px; color: #94a3b8; margin-top: 4px; font-weight: 400; }
    
    /* iOS In-Call Controls */
    .ios-actions-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 100%; max-width: 320px; margin: 30px 0; }
    .ios-btn-col { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
    .ios-circle-btn { width: 68px; height: 68px; border-radius: 50%; background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: none; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; transition: 0.2s; }
    .ios-circle-btn.active { background: #ffffff; color: #000000; }
    .ios-btn-lbl { font-size: 12px; color: #cbd5e1; font-weight: 500; }

    /* iOS Call Accept / Decline Buttons */
    .ios-call-triggers { display: flex; justify-content: space-around; width: 100%; max-width: 320px; align-items: center; }
    .ios-trigger-col { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
    .ios-btn-decline { width: 72px; height: 72px; border-radius: 50%; background: #ef4444; border: none; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; box-shadow: 0 6px 20px rgba(239,68,68,0.4); }
    .ios-btn-accept { width: 72px; height: 72px; border-radius: 50%; background: #22c55e; border: none; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; box-shadow: 0 6px 20px rgba(34,197,94,0.4); }

    /* Call Finished Screen */
    #callEndedScreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .ended-title { font-size: 22px; font-weight: 600; color: #94a3b8; margin-bottom: 12px; }
    .ended-btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 10px 24px; border-radius: 99px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- 1. Caller Interface -->
  <div class="card" id="mainInterface">
    <div class="badge">Shielded Relay</div>
    <h1>Contact Owner</h1>
    <p class="subtext">Identity &amp; phone numbers are completely masked.</p>

    <button class="btn btn-call" id="callBtn" onclick="initiateAudioCall()">
      📞 Start Voice Call
    </button>

    <div style="margin: 22px 0 16px; border-top: 1px solid #f1f5f9; position: relative;">
      <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #fff; padding: 0 12px; color: #94a3af; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;">OR SEND QUICK ALERT</span>
    </div>

    <button class="btn btn-preset" onclick="sendRelayAlert('🚗 Vehicle is blocking the gate/way')">
      🚗 Vehicle is blocking the gate
    </button>
    <button class="btn btn-preset" onclick="sendRelayAlert('⚠️ Lights left on / Window open')">
      ⚠️ Lights on / Window open
    </button>
    <button class="btn btn-preset" onclick="sendRelayAlert('🚨 Urgent: Please attend to vehicle')">
      🚨 Urgent: Please attend to vehicle
    </button>

    <div class="custom-box">
      <textarea id="customMsg" rows="2" placeholder="Type a message to owner..."></textarea>
      <button class="btn btn-send" onclick="sendCustomAlert()">Send Message</button>
    </div>
    <div id="statusMsg" class="status"></div>
  </div>

  <!-- 2. iPhone Styled Call View (Both Caller & Receiver use this when calling) -->
  <div id="iosCallView">
    <div class="ios-header">
      <div class="ios-avatar">🚗</div>
      <div class="ios-title" id="iosContactTitle">Vehicle Owner</div>
      <div class="ios-subtitle" id="iosCallTimer">Connecting...</div>
    </div>

    <!-- Active In-Call Grid (Mute / Speaker / Keypad) -->
    <div class="ios-actions-grid" id="iosInCallControls">
      <div class="ios-btn-col" onclick="toggleMute()">
        <button class="ios-circle-btn" id="iosMuteBtn">🎤</button>
        <span class="ios-btn-lbl" id="iosMuteLbl">Mute</span>
      </div>
      <div class="ios-btn-col" onclick="toggleSpeaker()">
        <button class="ios-circle-btn" id="iosSpeakerBtn">🔊</button>
        <span class="ios-btn-lbl">Speaker</span>
      </div>
      <div class="ios-btn-col" onclick="endCallAndTerminate()">
        <button class="ios-circle-btn" style="background:#ef4444;">☎️</button>
        <span class="ios-btn-lbl">End</span>
      </div>
    </div>

    <!-- Incoming Call Trigger Buttons (Accept / Decline) -->
    <div class="ios-call-triggers" id="iosIncomingActions">
      <div class="ios-trigger-col" onclick="endCallAndTerminate()">
        <button class="ios-btn-decline">✕</button>
        <span class="ios-btn-lbl" style="font-size:13px;">Decline</span>
      </div>
      <div class="ios-trigger-col" onclick="acceptIncomingCall()">
        <button class="ios-btn-accept">📞</button>
        <span class="ios-btn-lbl" style="font-size:13px;">Accept</span>
      </div>
    </div>
  </div>

  <!-- 3. Terminal Call Screen (Never returns to main page) -->
  <div id="callEndedScreen">
    <div class="ended-title">Call Ended</div>
    <p style="color:#64748b; font-size:13px; margin-bottom:20px;">The audio session has been terminated.</p>
    <button class="ended-btn" onclick="window.close()">Close Window</button>
  </div>

  <!-- Hardware Audio Stream -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const RELAY_ENDPOINT = "https://qr-relay-proxy.vstandsforvinay.workers.dev";
    
    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun.relay.metered.ca:80" }
        ]
      }
    };

    let peer = null;
    let activeCall = null;
    let localStream = null;
    let callTimerInterval = null;
    let secondsElapsed = 0;
    let isMuted = false;
    let targetCallerId = null;

    function showStatus(text, isError = false) {
      const el = document.getElementById("statusMsg");
      el.style.display = "block";
      el.style.color = isError ? "#ef4444" : "#16a34a";
      el.innerText = text;
      setTimeout(() => { el.style.display = "none"; }, 5000);
    }

    async function sendRelayAlert(text) {
      showStatus("Sending alert...");
      try {
        const res = await fetch(RELAY_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });
        if (res.ok) {
          showStatus("✓ Alert delivered to owner's phone!");
        } else {
          showStatus("Failed to deliver alert.", true);
        }
      } catch (err) {
        showStatus("Network error. Try again.", true);
      }
    }

    function sendCustomAlert() {
      const txt = document.getElementById("customMsg").value.trim();
      if (!txt) return;
      sendRelayAlert(`📝 Note: ${txt}`);
      document.getElementById("customMsg").value = "";
    }

    async function getMicrophone() {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
      } catch (e) {
        alert("Microphone permission is required to connect voice.");
        return null;
      }
    }

    function startTimer() {
      if (callTimerInterval) return;
      secondsElapsed = 0;
      callTimerInterval = setInterval(() => {
        secondsElapsed++;
        const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById("iosCallTimer").innerText = `${m}:${s}`;
      }, 1000);
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      document.getElementById("iosMuteBtn").classList.toggle("active", isMuted);
      document.getElementById("iosMuteLbl").innerText = isMuted ? "Unmute" : "Mute";
    }

    function toggleSpeaker() {
      const audio = document.getElementById("remoteAudio");
      audio.volume = audio.volume === 1.0 ? 0.5 : 1.0;
      document.getElementById("iosSpeakerBtn").classList.toggle("active", audio.volume === 1.0);
    }

    function setupStreamPipeline(stream) {
      const audioEl = document.getElementById("remoteAudio");
      audioEl.srcObject = stream;
      audioEl.play().catch(e => console.log("Audio play error:", e));

      // Switch to In-Call Controls
      document.getElementById("iosIncomingActions").style.display = "none";
      document.getElementById("iosInCallControls").style.display = "grid";
      startTimer();
    }

    function bindCallEvents(call) {
      activeCall = call;

      call.on("stream", (remoteStream) => {
        setupStreamPipeline(remoteStream);
      });

      if (call.peerConnection) {
        call.peerConnection.ontrack = (evt) => {
          if (evt.streams && evt.streams[0]) {
            setupStreamPipeline(evt.streams[0]);
          }
        };
      }

      call.on("close", () => endCallAndTerminate());
    }

    // Hangup and clean termination (Closes browser or shows terminated screen)
    function endCallAndTerminate() {
      clearInterval(callTimerInterval);
      if (activeCall) activeCall.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();

      document.getElementById("mainInterface").style.display = "none";
      document.getElementById("iosCallView").style.display = "none";
      document.getElementById("callEndedScreen").style.display = "flex";

      // Attempt window close (Works if opened directly or via script)
      window.close();
    }

    // CALLER SIDE (Scanner on Windshield)
    async function initiateAudioCall() {
      localStream = await getMicrophone();
      if (!localStream) return;

      document.getElementById("mainInterface").style.display = "none";
      document.getElementById("iosCallView").style.display = "flex";
      document.getElementById("iosContactTitle").innerText = "Vehicle Owner";
      document.getElementById("iosCallTimer").innerText = "Calling...";
      document.getElementById("iosIncomingActions").style.display = "none";
      document.getElementById("iosInCallControls").style.display = "grid";

      const callerId = "c" + Math.random().toString(36).substring(2, 8);
      peer = new Peer(callerId, PEER_CONFIG);

      peer.on("open", () => {
        const canonicalUrl = `https://vstandsforvinay.github.io/pdf-tools/contact/?call=${callerId}`;
        const alertMsg = `📞 INCOMING VOICE CALL!\n\nTap link to answer (Open in Chrome/Safari):\n${canonicalUrl}`;
        sendRelayAlert(alertMsg);
      });

      peer.on("call", (incomingCall) => {
        incomingCall.answer(localStream);
        bindCallEvents(incomingCall);
      });
    }

    // RECEIVER SIDE (Owner opens link from Telegram)
    async function acceptIncomingCall() {
      localStream = await getMicrophone();
      if (!localStream) return;

      document.getElementById("iosCallTimer").innerText = "Connecting line...";
      const receiverId = "r" + Math.random().toString(36).substring(2, 8);
      peer = new Peer(receiverId, PEER_CONFIG);

      peer.on("open", () => {
        const outgoingCall = peer.call(targetCallerId, localStream);
        bindCallEvents(outgoingCall);
      });
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      targetCallerId = urlParams.get("call");

      if (targetCallerId) {
        // Show Native iPhone Incoming Call UI
        document.getElementById("mainInterface").style.display = "none";
        document.getElementById("iosCallView").style.display = "flex";
        document.getElementById("iosContactTitle").innerText = "Vehicle Contact";
        document.getElementById("iosCallTimer").innerText = "Incoming Call...";
        document.getElementById("iosIncomingActions").style.display = "flex";
        document.getElementById("iosInCallControls").style.display = "none";
      }
    };
  </script>
</body>
</html>
