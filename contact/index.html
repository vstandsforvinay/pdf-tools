  <script>
    const RELAY_ENDPOINT = "https://qr-relay-proxy.vstandsforvinay.workers.dev";
    
    // Google Public STUN Servers to traverse NAT/Firewalls
    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" }
        ]
      }
    };

    let peer = null;
    let activeCall = null;
    let localStream = null;

    function showStatus(text, isError = false) {
      const el = document.getElementById("statusMsg");
      el.style.display = "block";
      el.style.color = isError ? "#dc2626" : "#059669";
      el.innerText = text;
      setTimeout(() => { el.style.display = "none"; }, 5000);
    }

    async function sendRelayAlert(text) {
      showStatus("Sending alert...");
      try {
        const res = await fetch(RELAY_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });
        if (res.ok) {
          showStatus("✓ Alert delivered to owner's phone!");
        } else {
          showStatus("Failed to deliver alert.", true);
        }
      } catch (err) {
        showStatus("Network error. Try again.", true);
      }
    }

    function sendCustomAlert() {
      const txt = document.getElementById("customMsg").value.trim();
      if (!txt) return;
      sendRelayAlert(`📝 Note: ${txt}`);
      document.getElementById("customMsg").value = "";
    }

    async function getMicrophone() {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
      } catch (e) {
        alert("Microphone permission is required to speak.");
        return null;
      }
    }

    function attachRemoteAudio(stream) {
      const audioEl = document.getElementById("remoteAudio");
      audioEl.srcObject = stream;
      audioEl.volume = 1.0;
      audioEl.play().catch(err => {
        console.warn("Audio autoplay blocked by browser:", err);
      });
    }

    function setupCallEventHandlers(call) {
      activeCall = call;
      document.getElementById("callStateLabel").innerText = "Call Connected (Live)";
      document.getElementById("callSubtext").innerText = "Speaking line active. Mic is open.";

      // Listen for remote audio stream
      call.on("stream", (remoteStream) => {
        attachRemoteAudio(remoteStream);
      });

      call.on("close", () => endCurrentCall(false));
      call.on("error", (err) => showStatus("Audio stream error: " + err, true));
    }

    // CALLER SIDE (Laptop / Scanner)
    async function initiateAudioCall() {
      localStream = await getMicrophone();
      if (!localStream) return;

      document.getElementById("mainInterface").style.display = "none";
      document.getElementById("callScreen").style.display = "block";
      document.getElementById("callStateLabel").innerText = "Starting Call...";
      document.getElementById("callSubtext").innerText = "Connecting to relay...";

      const callerId = "c" + Math.random().toString(36).substring(2, 8);
      peer = new Peer(callerId, PEER_CONFIG);

      peer.on("open", () => {
        const directLink = `https://vstandsforvinay.github.io/pdf-tools/contact/?call=${callerId}`;
        const alertMsg = `📞 INCOMING VOICE CALL!\n\nOpen link to answer:\n${directLink}`;

        document.getElementById("callStateLabel").innerText = "Calling Owner...";
        document.getElementById("callSubtext").innerText = "Waiting for owner to accept...";
        sendRelayAlert(alertMsg);
      });

      // When receiver calls back, answer with local mic stream
      peer.on("call", (incomingCall) => {
        incomingCall.answer(localStream);
        setupCallEventHandlers(incomingCall);
      });

      peer.on("error", (err) => showStatus("Call error: " + err.type, true));
    }

    // RECEIVER SIDE (Owner opening link on Phone)
    window.onload = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetCallerId = urlParams.get("call");

      if (targetCallerId) {
        document.getElementById("mainInterface").style.display = "none";
        document.getElementById("callScreen").style.display = "block";
        document.getElementById("callStateLabel").innerText = "Incoming Call";
        document.getElementById("callSubtext").innerHTML = 
          `<button class="btn btn-call" id="joinBtn" style="margin-top:10px;">🟢 Tap to Join & Speak</button>`;

        document.getElementById("joinBtn").onclick = async function() {
          this.disabled = true;
          this.innerText = "Connecting audio...";

          localStream = await getMicrophone();
          if (!localStream) {
            this.disabled = false;
            this.innerText = "Retry";
            return;
          }

          const receiverId = "r" + Math.random().toString(36).substring(2, 8);
          peer = new Peer(receiverId, PEER_CONFIG);

          peer.on("open", () => {
            // Dial caller with receiver's mic stream
            const outgoingCall = peer.call(targetCallerId, localStream);
            setupCallEventHandlers(outgoingCall);
          });

          peer.on("error", (err) => showStatus("Connection error: " + err.type, true));
        };
      }
    };

    function endCurrentCall(reload = true) {
      if (activeCall) activeCall.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      if (reload) window.location.href = window.location.pathname;
    }
  </script>
