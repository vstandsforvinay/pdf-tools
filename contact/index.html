<script>
    const RELAY_ENDPOINT = "https://qr-relay-proxy.vstandsforvinay.workers.dev";

    let peer = null;
    let activeCall = null;
    let localStream = null;

    function showStatus(text, isError = false) {
      const el = document.getElementById("statusMsg");
      el.style.display = "block";
      el.style.color = isError ? "#dc2626" : "#059669";
      el.innerText = text;
      setTimeout(() => { el.style.display = "none"; }, 5000);
    }

    async function sendRelayAlert(text) {
      showStatus("Sending alert...");
      try {
        const res = await fetch(RELAY_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });
        if (res.ok) {
          showStatus("✓ Alert delivered to owner's phone!");
        } else {
          showStatus("Failed to deliver alert. Try again.", true);
        }
      } catch (err) {
        showStatus("Network error. Try again.", true);
      }
    }

    function sendCustomAlert() {
      const txt = document.getElementById("customMsg").value.trim();
      if (!txt) return;
      sendRelayAlert(`📝 Note: ${txt}`);
      document.getElementById("customMsg").value = "";
    }

    async function getMicrophone() {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (e) {
        alert("Please grant microphone permissions to use voice calls.");
        return null;
      }
    }

    async function initiateAudioCall() {
      localStream = await getMicrophone();
      if (!localStream) return;

      document.getElementById("mainInterface").style.display = "none";
      document.getElementById("callScreen").style.display = "block";
      document.getElementById("callStateLabel").innerText = "Connecting to relay...";
      document.getElementById("callSubtext").innerText = "Notifying owner via Telegram...";

      const callerId = "caller_" + Math.random().toString(36).substring(2, 9);
      peer = new Peer(callerId);

      peer.on("open", () => {
        // Build answer URL dynamically based on current location
        const baseUrl = window.location.origin + window.location.pathname;
        const answerUrl = `${baseUrl}?call=${callerId}`;
        const msg = `📞 INCOMING VOICE CALL!\n\nTap to answer:\n${answerUrl}`;
        sendRelayAlert(msg);
      });

      peer.on("call", (incoming) => {
        incoming.answer(localStream);
        handleCallStream(incoming);
      });

      peer.on("error", (err) => {
        showStatus(`Connection error: ${err.type}`, true);
      });
    }

    function handleCallStream(call) {
      activeCall = call;
      document.getElementById("callStateLabel").innerText = "Call Connected (Live)";
      document.getElementById("callSubtext").innerText = "Audio stream is active & private.";

      call.on("stream", (remoteStream) => {
        const audio = document.getElementById("remoteAudio");
        audio.srcObject = remoteStream;
        audio.play().catch(e => console.log("Audio play error:", e));
      });

      call.on("close", () => {
        endCurrentCall(false);
      });
    }

    function endCurrentCall(reload = true) {
      if (activeCall) activeCall.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      if (reload) window.location.href = window.location.pathname;
    }

    // Receiver Handler (Phone opening the link from Telegram)
    window.onload = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetCallerId = urlParams.get("call");

      if (targetCallerId) {
        document.getElementById("mainInterface").style.display = "none";
        document.getElementById("callScreen").style.display = "block";
        document.getElementById("callStateLabel").innerText = "Incoming Call";
        document.getElementById("callSubtext").innerHTML = 
          `<button class="btn btn-call" id="answerBtn" style="margin-top:10px;">Tap to Connect Audio</button>`;

        document.getElementById("answerBtn").onclick = async function() {
          this.disabled = true;
          this.innerText = "Connecting...";

          localStream = await getMicrophone();
          if (!localStream) return;

          const receiverId = "receiver_" + Math.random().toString(36).substring(2, 9);
          peer = new Peer(receiverId);

          peer.on("open", () => {
            const call = peer.call(targetCallerId, localStream);
            handleCallStream(call);
          });

          peer.on("error", (err) => {
            showStatus(`Error linking call: ${err.type}`, true);
          });
        };
      }
    };
  </script>
